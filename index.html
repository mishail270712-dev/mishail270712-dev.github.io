<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хостинг Изображений</title>

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background-color: black;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }
        
        h1 {
            margin: 20px 0;
        }

        img {
            border: 5px solid white; 
            border-radius: 15px; 
            margin-top: 20px;
            max-width: 80%;
            height: auto;
        }

        p {
            margin-bottom: 40px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <h1>Сайт для хостинга изображений</h1>
    
    <img src="images/1.jpg" alt="Описание фото 1">
    <p>Изображение 1</p>

    <img src="images/2.jpg" alt="Описание фото 2">
    <p>Изображение 2</p>

    <img src="images/3.jpg" alt="Описание фото 3">
    <p>Изображение 3</p>
</body>
</html>
