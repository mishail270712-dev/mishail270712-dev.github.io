<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON NEXUS — Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    font-family: 'Russo One', sans-serif;
  }

  /* ОБЛОЖКА 800×470 (маленькая) */
  .cover {
    width: 800px;
    height: 470px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }

  /* Сетка из игры — тонкие голубые линии 40×40 */
  .cover::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0, 243, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 243, 255, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 1;
  }

  /* Дополнительное свечение от центра */
  .cover::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 700px; height: 700px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(188, 19, 254, 0.15) 0%, transparent 60%);
    pointer-events: none;
    z-index: 2;
  }

  /* Иконка ядра */
  .core {
    position: relative;
    z-index: 3;
    width: 200px;
    height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .core-img {
    width: 100%;
    height: 100%;
    background: #8b6dff; /* фиолетовый фон иконки */
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 100px;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(188, 19, 254, 0.5);
  }

  /* Светящиеся кольца вокруг ядра */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 2px dashed #00f3ff;
    box-shadow: 0 0 15px #00f3ff;
    opacity: 0.6;
    animation: spin 8s linear infinite;
  }
  .ring.r1 { width: 200px; height: 200px; }
  .ring.r2 {
    width: 240px; height: 240px;
    border-color: #bc13fe;
    box-shadow: 0 0 15px #bc13fe;
    animation: spinReverse 12s linear infinite;
    opacity: 0.4;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinReverse { to { transform: rotate(-360deg); } }

  /* Текст */
  .title {
    position: relative;
    z-index: 3;
    font-size: 52px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 6px;
    text-shadow:
      0 0 15px #00f3ff,
      0 0 30px #00f3ff,
      2px 2px 0 #bc13fe,
      -2px -2px 0 #00f3ff;
    animation: glitch 3s infinite;
    text-align: center;
  }

  .subtitle {
    position: relative;
    z-index: 3;
    font-size: 24px;
    color: #bc13fe;
    text-transform: uppercase;
    letter-spacing: 8px;
    text-shadow: 0 0 20px #bc13fe;
    text-align: center;
  }

  .studio {
    position: absolute;
    bottom: 15px;
    right: 20px;
    z-index: 3;
    font-family: 'Exo 2', sans-serif;
    font-size: 12px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @keyframes glitch {
    0%, 100% { transform: translate(0, 0); }
    2% { transform: translate(-2px, 2px); }
    4% { transform: translate(2px, -2px); }
    6% { transform: translate(0, 0); }
  }

  /* Угловые акценты */
  .accent {
    position: absolute;
    z-index: 3;
    font-size: 40px;
    opacity: 0.5;
    filter: drop-shadow(0 0 15px currentColor);
  }
  .accent.tl { top: 20px; left: 25px; color: #ffd700; }
  .accent.br { bottom: 20px; left: 25px; color: #00f3ff; }

  /* === ВАРИАНТ 1920×1080 (большая обложка) === */
  /* Раскомментируй этот блок и закомментируй .cover выше, если нужна большая */
  /*
  .cover {
    width: 1920px;
    height: 1080px;
  }
  .core { width: 380px; height: 380px; }
  .core-img { font-size: 200px; }
  .ring.r1 { width: 380px; height: 380px; }
  .ring.r2 { width: 460px; height: 460px; }
  .title { font-size: 110px; letter-spacing: 12px; }
  .subtitle { font-size: 48px; letter-spacing: 16px; }
  .studio { font-size: 20px; bottom: 30px; right: 40px; }
  .accent { font-size: 80px; }
  .accent.tl { top: 40px; left: 50px; }
  .accent.br { bottom: 40px; left: 50px; }
  .cover::after { width: 1400px; height: 1400px; }
  */
</style>
</head>
<body>

<div class="cover">
  <div class="core">
    <div class="ring r2"></div>
    <div class="ring r1"></div>
    <div class="core-img">⚛️</div>
  </div>
  <div class="title">НЕОН НЕКСУС</div>
  <div class="subtitle">Перегрузка ядра</div>
  <div class="studio">Pompushka Games Studio</div>
  <div class="accent tl">⚡</div>
  <div class="accent br">💎</div>
</div>

</body>
</html>
